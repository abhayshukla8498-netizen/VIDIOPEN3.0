name: Build Android APK & AAB (Signed)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Project & Setup Release Key
      run: |
        # Extract Zip File
        unzip -o "novaplay (1).zip"
        
        # Find directory containing settings.gradle.kts
        TARGET_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        PROJECT_DIR=$(dirname "$TARGET_FILE")
        
        echo "Building inside: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Generate Keystore with password: Abhay@2008
        keytool -genkeypair -v \
          -keystore my-upload-key.jks \
          -storepass "Abhay@2008" \
          -alias upload \
          -keypass "Abhay@2008" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Abhay, OU=NovaPlay, O=Vidiopen, C=IN"
        
        # Create debug.keystore fallback
        keytool -genkeypair -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug, O=Android, C=US"
        
        # Setup Gradle wrapper
        gradle wrapper
        chmod +x gradlew
        
        # Build both APK and AAB (App Bundle)
        ./gradlew assembleRelease bundleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/my-upload-key.jks \
          -Pandroid.injected.signing.store.password="Abhay@2008" \
          -Pandroid.injected.signing.key.alias="upload" \
          -Pandroid.injected.signing.key.password="Abhay@2008"

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Release-APK
        path: '**/app/build/outputs/apk/release/*.apk'

    - name: Upload AAB (App Bundle) File
      uses: actions/upload-artifact@v4
      with:
        name: Vidiopen-Release-AAB
        path: '**/app/build/outputs/bundle/release/*.aab'
        
