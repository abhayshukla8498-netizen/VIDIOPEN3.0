name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip Project & Build APK
      run: |
        # Zip extract karte hain
        unzip -o "novaplay (1).zip"
        
        TARGET_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        PROJECT_DIR=$(dirname "$TARGET_FILE")
        
        echo "Building inside: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Missing debug.keystore auto-generate karte hain
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # Wrapper & Build
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
        
