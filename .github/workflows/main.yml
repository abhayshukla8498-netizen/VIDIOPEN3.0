name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find Project Directory & Build
      run: |
        # Search for build.gradle or settings.gradle across all subdirectories
        TARGET_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle.kts" \) -not -path "*/app/*" | head -n 1)
        
        if [ -n "$TARGET_FILE" ]; then
          PROJECT_DIR=$(dirname "$TARGET_FILE")
        else
          echo "Could not find build files automatically, listing directory structure:"
          ls -la
          exit 1
        fi

        echo "Building inside: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
        
